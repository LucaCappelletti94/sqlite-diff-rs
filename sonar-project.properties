# SonarQube Cloud analysis configuration. The organization and project keys
# come from the SonarQube Cloud project import and must match it exactly.
sonar.organization=lucacappelletti94-github
sonar.projectKey=LucaCappelletti94_sqlite-diff-rs
sonar.projectName=sqlite-diff-rs

sonar.sources=src,tests,benches,fuzz,compile-bench,integration-tests
# Integration tests live in tests/ trees. Inline #[cfg(test)] modules stay
# classified as sources, which is the Rust reality.
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/target/**
sonar.sourceEncoding=UTF-8

# The analyzer runs cargo clippy itself, on the root workspace manifest.
# The diesel-e2e and schema-aware-roundtrip workspaces are excluded from the
# workspace and need services the scan runner does not have, so they are not
# built here. Their sources are still indexed for metrics, complexity, and
# duplication.
sonar.rust.cargo.manifestPaths=Cargo.toml
